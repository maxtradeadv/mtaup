<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest?v=10"><link rel="icon" type="image/svg+xml" href="icon.svg?v=10"><link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=10"><link rel="stylesheet" href="styles.css?v=20260923d"><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js?v=36",{updateViaCache:"none"}).catch(()=>{});}window.addEventListener("error",function(e){var x=document.getElementById("liveStatusInline");if(x)x.textContent="Data Connection · JS ERROR: "+(e.message||"script error")});window.addEventListener("unhandledrejection",function(e){var x=document.getElementById("liveStatusInline");if(x)x.textContent="Data Connection · ERROR: "+(e.reason&&e.reason.message||e.reason||"promise rejected")});</script><title>Max Trade Advice</title></head><body><header><div><h1>MAX TRADE ADVICE</h1><p>ALL STOCK SCANNER · Pareto Moment · Broker Flow · Timing</p></div><span id="status">DEMO</span><button id="captureResult" class="header-capture" type="button">Capture</button></header><main><section class="controls card"><label class="stockpicker">Saham<div class="stockcombo"><input id="tickerSearch" type="search" placeholder="Pilih / ketik kode saham…" autocomplete="off" enterkeyhint="search" role="combobox" aria-controls="tickerOptions" aria-expanded="false"><input id="ticker" type="hidden" value="ALL"><div id="tickerOptions" class="ticker-options" role="listbox" aria-label="Daftar saham"></div></div></label><label class="lookbackpicker">Lookback<select id="lookback"><option value="5">5D</option><option value="10">10D</option><option value="20" selected>20D</option><option value="60">60D</option></select></label><label class="providerpicker">Data Source<select id="provider"><option value="auto">AUTO — Daily Remote CSV → Yahoo → Cache</option><option value="remote-csv">DAILY REMOTE CSV</option><option value="yahoo">YAHOO FINANCE (historical)</option><option value="idx">IDX OFFICIAL — ALL MARKET</option></select></label></section><section class="card mta-dashboard"><div id="momentPareto" class="moment-pareto"></div></section><section class="card app-log"><div><b>APP LOG</b><small id="providerInfoText">Data Source · AUTO: Daily Remote CSV → Yahoo Finance historical → cache lokal. Broker Rotation hanya ditampilkan bila ada data broker tervalidasi.</small><small id="liveStatusInline">Data Connection · <span id="lastUpdateInline">-</span></small><footer>© 2026 Maxsave Official</footer></div></section></main><script src="analysis.js?v=20260923d"></script><script src="data-provider.js?v=20260923d"></script><script src="calibration.js?v=20260923d"></script><script src="app.js?v=20260923d"></script><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script>document.getElementById("captureResult").onclick=async()=>{const btn=document.getElementById("captureResult"),old=btn.textContent;try{btn.disabled=true;btn.textContent="Capturing…";if(!window.html2canvas)throw Error("capture engine belum siap");const canvas=await html2canvas(document.querySelector("main"),{backgroundColor:"#f5f7fb",scale:Math.min(2,window.devicePixelRatio||1),useCORS:true,logging:false});canvas.toBlob(blob=>{if(!blob)return;const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="mta-result-"+new Date().toISOString().slice(0,19).replace(/[T:]/g,"-")+".png";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},"image/png")}catch(e){const out=document.getElementById("liveStatusInline");if(out)out.textContent="Data Connection · Capture gagal: "+e.message}finally{btn.disabled=false;btn.textContent=old}};</script></body></html>
